spring.application.name=ms-usuarios
server.port=8081

# Los datos sensibles se leen desde el archivo .env (ver .env.example)
spring.config.import=optional:file:.env[.properties]

# Conexion a Oracle Cloud mediante wallet
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas se crean con database/script_ms_usuarios.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Token de inicio de sesion
app.jwt.secreto=${JWT_SECRET}
app.jwt.expiracion-minutos=120

# Dominios externos autorizados a consumir la API
app.cors.origenes=http://localhost:3000,http://localhost:4200

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Niveles de log
logging.level.root=INFO
logging.level.com.foro.usuarios=DEBUG
